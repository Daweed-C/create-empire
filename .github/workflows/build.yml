name: Build modpack

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Resolve mod list
        run: ./scripts/bootstrap.sh

      - name: Export Modrinth pack (.mrpack)
        working-directory: pack
        run: packwiz modrinth export -o "../Create-Empire.mrpack"

      - name: Export CurseForge pack (.zip)
        working-directory: pack
        run: packwiz curseforge export -o "../Create-Empire-curseforge.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: create-empire-modpack
          path: |
            Create-Empire.mrpack
            Create-Empire-curseforge.zip
            bootstrap-report.txt

      - name: Publish resolved pack to deploy branch
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          cd pack
          cp ../bootstrap-report.txt . || true
          git init -b deploy
          git -c user.name="github-actions" -c user.email="actions@github.com" add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -m "Resolved pack from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Create-Empire.mrpack
            Create-Empire-curseforge.zip
            bootstrap-report.txt
